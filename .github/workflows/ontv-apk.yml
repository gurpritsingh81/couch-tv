name: ontv-apk
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build the phone remote
        run: cd remote && npm ci --no-audit --no-fund && npm run build
      - name: Build the on-TV app (it carries the remote)
        run: |
          chmod +x tv-home/android/gradlew
          tv-home/android/gradlew -p on-tv/android --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: couch-tv-ontv-apk
          path: on-tv/android/app/build/outputs/apk/release/app-release.apk
